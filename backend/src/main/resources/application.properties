server.port=8080
spring.application.name=ticketflow


spring.datasource.url=${MYSQL_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/ticketflow_db?createDatabaseIfNotExist=true&serverTimezone=UTC}}
spring.datasource.username=${MYSQL_USER:${DATABASE_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - Use environment variables for security
application.security.jwt.secret-key=${JWT_SECRET_KEY:dev-secret-key-for-development-only-not-for-production-change-me-in-production}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/tickets}

logging.level.org.springframework.web=DEBUG

